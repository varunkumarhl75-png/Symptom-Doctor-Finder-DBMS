<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | MediFind AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="results-page">
    <header class="topbar results-topbar">
        <div class="container nav-wrap">
            <div class="brand-wrap"><div class="brand-mark">M</div><span>MediFind AI</span></div>
            <div class="nav-actions">{% include "auth_nav.html" %}</div>
        </div>
    </header>
    <main class="results-main">
        <div class="container confirmation-card">
            <h1>Log in</h1>
            <p>Sign in to book and manage your appointments.</p>
            {% if error %}<div class="error-box" role="alert">{{ error }}</div>{% endif %}
            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ next_path or '' }}">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" maxlength="150" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="primary-btn" type="submit">Log in</button>
            </form>
            <p>New patient? <a href="{{ url_for('register') }}">Create an account</a>.</p>
        </div>
    </main>
</body>
</html>
